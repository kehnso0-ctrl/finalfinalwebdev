# Netlify Configuration for NexusArena Multi-Page Platform
[build]
  command = "npm run build"
  publish = "dist"

# Prevent MIME type errors for static assets
[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
